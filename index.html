<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora — генерация изображений</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <header class="header">
      <h1 class="logo">Aurora</h1>
      <p class="subtitle">Генерация изображений с помощью ИИ</p>

      <nav class="tabs">
        <button class="tab active" data-tab="generator">✨ Генерация</button>
        <button class="tab" data-tab="gallery">🖼️ Галерея <span id="galleryCount" class="badge">0</span></button>
      </nav>
    </header>

    <!-- ===== ВКЛАДКА: ГЕНЕРАЦИЯ ===== -->
    <section class="tab-content active" id="tab-generator">
      <div class="layout">

        <!-- ЛЕВАЯ КОЛОНКА -->
        <div class="panel">

          <!-- Промт -->
          <div class="field">
            <label class="label" for="prompt">Ваш промт</label>
            <textarea id="prompt" class="textarea"
              placeholder="Опишите, что вы хотите увидеть..."></textarea>
          </div>

          <!-- Модель -->
          <div class="field">
            <label class="label">Модель</label>
            <div class="dropdown" id="modelDropdown">
              <button type="button" class="dropdown-toggle" id="modelToggle">
                <span id="modelLabel">Nano Banana 2</span>
                <span class="dropdown-arrow">▾</span>
              </button>
              <ul class="dropdown-menu" id="modelMenu">
                <li class="dropdown-item active" data-model="nano-banana-2">
                  <span class="dot dot-2"></span> Nano Banana 2
                </li>
                <li class="dropdown-item" data-model="nano-banana-pro">
                  <span class="dot dot-pro"></span> Nano Banana Pro
                </li>
                <li class="dropdown-item" data-model="nano-banana-lite">
                  <span class="dot dot-lite"></span> Nano Banana Lite
                </li>
              </ul>
            </div>
          </div>

          <!-- Входные изображения -->
          <div class="field">
            <label class="label">
              Входные изображения
              <span class="counter" id="imagesCounter">0 / 4</span>
            </label>
            <label class="drop-zone" id="dropZone">
              <div class="drop-zone-icon">📎</div>
              <div class="drop-zone-text">Нажмите или перетащите файлы</div>
              <div class="drop-zone-hint" id="dropZoneHint">PNG, JPG, WEBP — максимум 4 файлов</div>
              <input type="file" id="imageInput" accept="image/*" multiple hidden>
            </label>
            <div id="imagesPreview" class="images-preview"></div>
          </div>

          <!-- Перевод (Pro) -->
          <div class="field hidden" id="translateRow">
            <label class="checkbox-row">
              <input type="checkbox" id="translateInput">
              <span>Перевод входящих данных</span>
            </label>
          </div>

          <!-- Соотношение -->
          <div class="field">
            <label class="label">Соотношение сторон</label>
            <select id="ratioSelect" class="select">
              <option value="auto">auto</option>
              <option value="21:9">21:9</option>
              <option value="16:9">16:9</option>
              <option value="3:2">3:2</option>
              <option value="4:3">4:3</option>
              <option value="5:4">5:4</option>
              <option value="1:1" selected>1:1</option>
              <option value="4:5">4:5</option>
              <option value="3:4">3:4</option>
              <option value="9:16">9:16</option>
              <option value="9:21">9:21</option>
            </select>
          </div>

          <!-- Разрешение -->
          <div class="field hidden" id="resolutionBlock">
            <label class="label">Разрешение</label>
            <select id="resolutionSelect" class="select"></select>
          </div>

          <!-- Версия -->
          <div class="field hidden" id="versionBlock">
            <label class="label">Версия нейросети</label>
            <select id="versionSelect" class="select">
              <option value="v1">v1</option>
              <option value="v2">v2</option>
            </select>
          </div>

          <!-- Количество -->
          <div class="field">
            <label class="label">Количество изображений: <span id="numImagesValue">1</span></label>
            <input type="range" id="numImages" min="1" max="4" value="1" class="range">
          </div>

          <!-- Seed -->
          <div class="field hidden" id="seedBlock">
            <label class="label">Случайное зерно (seed)</label>
            <input type="number" id="seedInput" class="input" placeholder="Пусто = случайное">
          </div>

          <!-- Системный промт -->
          <div class="field hidden" id="systemPromptBlock">
            <label class="label">Системный промт</label>
            <textarea id="systemPrompt" class="textarea" style="min-height:70px"
              placeholder="Дополнительные инструкции"></textarea>
          </div>

          <!-- Формат -->
          <div class="field">
            <label class="label">Формат вывода</label>
            <select id="formatSelect" class="select">
              <option value="png" selected>png</option>
              <option value="jpeg">jpeg</option>
              <option value="webp">webp</option>
            </select>
          </div>

          <!-- Веб-поиск -->
          <div class="field hidden" id="webSearchRow">
            <label class="checkbox-row">
              <input type="checkbox" id="webSearch">
              <span>Веб-поиск</span>
            </label>
          </div>

          <!-- Thinking -->
          <div class="field hidden" id="thinkingBlock">
            <label class="label">Уровень размышления модели</label>
            <select id="thinkingSelect" class="select">
              <option value="">Выбрать...</option>
              <option value="minimal">minimal</option>
              <option value="high">high</option>
            </select>
          </div>

          <button id="generateBtn" class="generate-btn" type="button">
            ✨ Сгенерировать
          </button>

        </div>

        <!-- ПРАВАЯ КОЛОНКА: результат -->
        <div class="result-panel" id="resultPanel">
          <div class="result-empty" id="resultEmpty">
            <div class="result-empty-icon">🎨</div>
            <p class="result-empty-text">Здесь появится ваше изображение</p>
            <p class="result-empty-hint">Введите промт и нажмите «Сгенерировать»</p>
          </div>

          <div class="result-content hidden" id="resultContent">
            <div id="resultImages" class="result-grid"></div>
            <div class="result-info">
              <p id="resultMeta" class="result-meta"></p>
              <div class="result-actions">
                <button id="downloadCurrent" class="action-btn">⬇ Скачать всё</button>
                <button id="clearResult" class="action-btn">✕ Очистить</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- ===== ВКЛАДКА: ГАЛЕРЕЯ ===== -->
    <section class="tab-content" id="tab-gallery">
      <div class="gallery-header">
        <h2 class="gallery-title">Ваши работы</h2>
        <button id="clearGallery" class="clear-gallery" type="button">Очистить всё</button>
      </div>
      <div id="gallery" class="gallery">
        <p class="gallery-empty" id="galleryEmpty">Пока ничего не сгенерировано</p>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
